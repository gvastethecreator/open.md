name: store-readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/store-readiness.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/**"
      - "src-tauri/**"
      - "scripts/store/**"
      - "docs/store/**"
      - "docs/privacy.html"
      - "PRIVACY.md"
      - "README.md"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/store-readiness.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/**"
      - "src-tauri/**"
      - "scripts/store/**"
      - "docs/store/**"
      - "docs/privacy.html"
      - "PRIVACY.md"
      - "README.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      build_signed_candidate:
        description: "Build a signed Store NSIS candidate using repository secrets"
        required: true
        default: false
        type: boolean
      require_submission_ready:
        description: "Require reservation, hosting, signing and updater gates"
        required: true
        default: false
        type: boolean
      run_lifecycle_smoke:
        description: "Install and uninstall the candidate on the runner"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: store-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate Store contracts
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.0.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application
        run: pnpm run verify

      - name: Validate Store structure
        shell: powershell
        run: >
          .\scripts\store\Test-StoreReadiness.ps1
          -EvidencePath artifacts\store-readiness.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-md-store-readiness
          path: artifacts/store-readiness.json
          if-no-files-found: warn

  signed-candidate:
    name: build signed Store candidate
    if: github.event_name == 'workflow_dispatch' && inputs.build_signed_candidate
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.0.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize code-signing certificate
        shell: powershell
        env:
          CERTIFICATE_BASE64: ${{ secrets.OPENMD_WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            throw "OPENMD_WINDOWS_CERTIFICATE_BASE64 is required."
          }
          $path = Join-Path $env:RUNNER_TEMP "openmd-code-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "OPENMD_WINDOWS_CERTIFICATE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build signed candidate
        shell: powershell
        env:
          OPENMD_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.OPENMD_WINDOWS_CERTIFICATE_PASSWORD }}
          OPENMD_WINDOWS_TIMESTAMP_URL: ${{ secrets.OPENMD_WINDOWS_TIMESTAMP_URL }}
        run: |
          $arguments = @()
          if ("${{ inputs.require_submission_ready }}" -eq "true") {
            $arguments += "-RequireSubmissionReady"
          }
          if ("${{ inputs.run_lifecycle_smoke }}" -eq "true") {
            $arguments += "-RunLifecycleSmoke"
          }
          .\scripts\store\Build-StoreInstaller.ps1 @arguments

      - name: Upload signed candidate and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-md-signed-store-candidate
          path: artifacts/store/**
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        shell: powershell
        run: |
          if ($env:OPENMD_WINDOWS_CERTIFICATE_PATH) {
            Remove-Item -LiteralPath $env:OPENMD_WINDOWS_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          }
