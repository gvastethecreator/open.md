; Lumen Harbor radio scratch
; .cfg is the same INI family. Frequencies the fog answers.

[unit]
name=Harbor Radio
call_sign=LH-00
operator=the unnamed keeper
watch=last
powered=true

[channel.1]
label=harbor working
freq_khz=1568
mode=usb
noise=low
notes=daylight only, gulls optional

[channel.2]
label=tides
freq_khz=1812
mode=lsb
noise=salt
notes=numbers, then more numbers

[channel.3]
label=moth union
freq_khz=1987
mode=cw
noise=paper
notes=Ida votes present. Percival abstains.

[channel.4]
label=distress / fog
freq_khz=2182
mode=usb
noise=high
last_heard=number
swallowed_at=2026-08-26T22:10:00Z
retry_seconds=11
notes=If the fog answers, write it down. Do not invent the last digit.

[channel.5]
label=desk to desk
freq_khz=2400
mode=am
noise=memory
notes=the 2400 baud handshake is a memory. do not phone home.

[squelch]
open=true
threshold=7
hold_ms=400

[log]
file=overnight.log
record_static=true
record_numbers=true
record_voices=false

[unicode]
coffee=café
city=東京
greeting=CQ CQ DE LH-00
