# Lumen Harbor pier daemon
# .conf companion, INI family. The process that pretends the pier is a computer.

daemon off;
user keeper;
pid /run/lumen-harbor.pid;
error_log overnight.log warn;

watch {
    name last;
    lamp 4;
    wick_mm 7;
    cloud off;
}

weather {
    fog_m 62;
    rain vertical;
    tide_cm 184;
    tide_phase flood;
}

radio {
    listen 2182;
    call_sign LH-00;
    retry_seconds 11;
    swallow_voice on;
}

moths {
    ida present;
    percival halo;
    little_noise smudge;
    glass_eater critic;
    bookmarks off;
}

documents {
    root .;
    notebook a-quiet-place.md;
    bible lumen-harbor.markdown;
    letter night-watch.txt;
    telemetry lumen-harbor.json;
    program_nfo lumen-station.nfo;
    kodi_movie kodi-the-quiet-place.nfo;
    kodi_show kodi-harbor-nights.nfo;
    msinfo windows-msinfo.nfo;
}

limits {
    nfo_edit off;
    log_edit off;
    wrap_nfo off;
    columns 80;
}

# last-watch location
location /pier {
    desk oak;
    chair empty;
    notebook on;
    image assets/harbor-night.png;
}

location /glass {
    chair reflection;
    sit off;
    image assets/rain-glass.avif;
}

unicode {
    coffee café;
    attempt naïve;
    city 東京;
    tagline "The document is the interface.";
}
